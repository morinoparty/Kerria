name: preview.yml
on:
  pull_request:
    types: [opened, synchronize, closed]
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: read
  id-token: write
  attestations: write

env:
  AWS_EC2_METADATA_DISABLED: true
  AWS_REGION: auto
  AWS_CLI_FILE_ENCODING: UTF-8
  AWS_DEFAULT_S3_SIGNATURE_VERSION: s3v4
  S3_UPLOAD_BUCKET: ${{ secrets.S3_UPLOAD_BUCKET }}
  S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
  PREVIEW_BASE_URL: ${{ vars.PREVIEW_BASE_URL }}
  PROJECT_NAME: Kerria

jobs:
  # 共通の前処理：コミットSHAを取得
  setup:
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.vars.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set short git commit SHA
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short HEAD)
          echo "commit_sha=$calculatedSha" >> $GITHUB_OUTPUT

  # Gradle ビルドジョブ（docs と並列実行）
  build-gradle:
    needs: setup
    runs-on: ubuntu-latest
    outputs:
      test_total: ${{ steps.publish-test-results.outputs.total }}
      test_passed: ${{ steps.publish-test-results.outputs.passed }}
      test_skipped: ${{ steps.publish-test-results.outputs.skipped }}
      test_failed: ${{ steps.publish-test-results.outputs.failed }}
    env:
      COMMIT_SHORT_SHA: ${{ needs.setup.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '25'

      # Gradle キャッシュの設定（setup-gradle を使用）
      - uses: gradle/actions/setup-gradle@8379f6a1328ee0e06e2bb424dadb7b159856a326 # v4.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: change plugin.yml version
        run: |
          sed -i "s/VersionPlaceholder/${{ env.COMMIT_SHORT_SHA }}/" ./gradle.properties

      - name: Build with Gradle
        continue-on-error: true
        run: ./gradlew build

      - name: Install Allure CLI
        if: success() || failure()
        run: |
          curl -sL https://github.com/allure-framework/allure2/releases/download/2.32.2/allure-2.32.2.tgz | tar -xz
          echo "$PWD/allure-2.32.2/bin" >> $GITHUB_PATH

      - name: Generate Allure report
        if: success() || failure()
        continue-on-error: true
        run: allure generate ./paper/build/allure-results -o ./paper/build/allure-report --clean

      - name: Publish test results
        id: publish-test-results
        uses: mikepenz/action-junit-report@e08919a3b1fb83a78393dfb775a9c37f17d8eea6 # v6.0.1
        if: success() || failure()
        with:
          report_paths: './**/build/test-results/test/TEST-*.xml'

      - name: Prepare Gradle artifacts
        run: |
          mkdir -p ./gradle-artifacts/jars
          mkdir -p ./gradle-artifacts/junit
          mkdir -p ./gradle-artifacts/detekt
          mkdir -p ./gradle-artifacts/allure
          mv ./paper/build/libs/paper-*-all.jar ./gradle-artifacts/jars/${{ env.PROJECT_NAME }}-paper-${{ env.COMMIT_SHORT_SHA }}.jar
          # sourcesJARを除外してメインJARのみ移動
          api_jar=$(find ./api/build/libs/ -name "api-*.jar" ! -name "*-sources.jar" | head -1)
          mv "$api_jar" ./gradle-artifacts/jars/${{ env.PROJECT_NAME }}-api-${{ env.COMMIT_SHORT_SHA }}.jar

          cp -r ./paper/build/reports/tests/test/* ./gradle-artifacts/junit/ || echo "No JUnit reports found"
          cp -r ./build/reports/detekt/* ./gradle-artifacts/detekt/
          cp -r ./paper/build/allure-report/* ./gradle-artifacts/allure/ || echo "No Allure reports found"

      # GitHub Attestations で署名
      - name: Attest JAR artifacts
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: './gradle-artifacts/jars/*.jar'

      - name: Upload Gradle artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gradle-artifacts
          path: ./gradle-artifacts
          retention-days: 1

  # Docs ビルドジョブ（gradle と並列実行）
  build-docs:
    needs: setup
    runs-on: ubuntu-latest
    env:
      COMMIT_SHORT_SHA: ${{ needs.setup.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: 'temurin'
          java-version: '25'

      # Gradle キャッシュの設定（Dokka 生成用）
      - uses: gradle/actions/setup-gradle@8379f6a1328ee0e06e2bb424dadb7b159856a326 # v4.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        name: Install pnpm
        with:
          version: 10
          run_install: false

      # pnpm キャッシュの設定
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        name: Setup pnpm cache
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install

      - name: Generate Dokka API documentation
        run: ./gradlew dokkaGenerate

      - name: Build Fumadocs
        working-directory: docs
        env:
          BASE_PATH: /${{ env.PROJECT_NAME }}/${{ env.COMMIT_SHORT_SHA }}/docs
        run: pnpm run build

      - name: Upload docs artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-artifacts
          path: ./docs/out
          retention-days: 1

  # S3 アップロードジョブ（JAR・Docs・レポート）
  upload-s3:
    needs: [setup, build-gradle, build-docs]
    runs-on: ubuntu-latest
    env:
      COMMIT_SHORT_SHA: ${{ needs.setup.outputs.commit_sha }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ./artifacts

      - name: Prepare upload directory
        run: |
          mkdir -p ./upload
          cp -r ./artifacts/gradle-artifacts/jars ./upload/ || echo "No JAR artifacts"
          cp -r ./artifacts/gradle-artifacts/junit ./upload/ || echo "No JUnit reports"
          cp -r ./artifacts/gradle-artifacts/detekt ./upload/ || echo "No Detekt reports"
          cp -r ./artifacts/gradle-artifacts/allure ./upload/ || echo "No Allure reports"
          mkdir -p ./upload/docs
          mv ./artifacts/docs-artifacts/* ./upload/docs/

      # Bitwarden Secrets Manager から S3 アップロード用の AWS 認証情報を取得する
      - name: Fetch secrets from Bitwarden Secrets Manager
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ secrets.NIKOMARU_BITWARDEN_SECRET_MANAGER_ACCESS_TOKEN }}
          secrets: |
            37e4d53a-a898-4e9f-b067-b49900deaf4f > AWS_ACCESS_KEY_ID
            4d92b739-40fc-467f-97fa-b49900deb52c > AWS_SECRET_ACCESS_KEY

      - name: Upload to S3 (parallel)
        run: |
          # AWS CLIの並列リクエスト数を増やす
          aws configure set default.s3.max_concurrent_requests 50

          S3_BASE="s3://${{ env.S3_UPLOAD_BUCKET }}/${{ env.PROJECT_NAME }}/${{ env.COMMIT_SHORT_SHA }}"
          S3_OPTS="--endpoint-url ${S3_ENDPOINT} --only-show-errors"

          # JAR・Docs・レポートを並列でアップロード
          aws s3 cp ./upload/jars $S3_BASE/jars $S3_OPTS --recursive &
          aws s3 cp ./upload/junit $S3_BASE/junit $S3_OPTS --recursive &
          aws s3 cp ./upload/detekt $S3_BASE/detekt $S3_OPTS --recursive &
          aws s3 cp ./upload/allure $S3_BASE/allure $S3_OPTS --recursive &
          aws s3 cp ./upload/docs $S3_BASE/docs $S3_OPTS --recursive &

          # 全ての並列アップロードを待機
          wait
          echo "S3 upload completed"

  # コメント作成ジョブ
  comment:
    needs: [setup, build-gradle, upload-s3]
    runs-on: ubuntu-latest
    if: ${{ github.event.action == 'opened' || github.event.action == 'synchronize' }}
    env:
      COMMIT_SHORT_SHA: ${{ needs.setup.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download JAR artifacts for comment generation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gradle-artifacts
          path: ./artifacts/gradle-artifacts

      # コメントに載せる JAR のサイズを計算する
      - name: Get JAR sizes
        id: jar-sizes
        run: |
          # バイト数を読みやすい単位に変換する (1 MiB 以上は MB、それ未満は KB)
          human_size() {
            local bytes
            bytes=$(stat -c %s "$1")
            if [ "$bytes" -ge 1048576 ]; then
              awk -v b="$bytes" 'BEGIN { printf "%.1f MB", b / 1048576 }'
            else
              awk -v b="$bytes" 'BEGIN { printf "%.1f KB", b / 1024 }'
            fi
          }
          JARS=./artifacts/gradle-artifacts/jars
          echo "paper=$(human_size "$JARS/${{ env.PROJECT_NAME }}-paper-${{ env.COMMIT_SHORT_SHA }}.jar")" >> $GITHUB_OUTPUT
          echo "api=$(human_size "$JARS/${{ env.PROJECT_NAME }}-api-${{ env.COMMIT_SHORT_SHA }}.jar")" >> $GITHUB_OUTPUT

      - name: Get limit time
        id: limit-time
        run: |
          limit_time=$(date -d "7 days" +%Y-%m-%d)
          echo "LIMIT_TIME=$limit_time" >> $GITHUB_ENV

      - name: Create comment file
        env:
          JAR_BASE_URL: "${{ env.PREVIEW_BASE_URL }}/${{ env.PROJECT_NAME }}/${{ env.COMMIT_SHORT_SHA }}/jars"
          JUNIT_REPORT_URL: "${{ env.PREVIEW_BASE_URL }}/${{ env.PROJECT_NAME }}/${{ env.COMMIT_SHORT_SHA }}/junit/index.html"
          ALLURE_REPORT_URL: "${{ env.PREVIEW_BASE_URL }}/${{ env.PROJECT_NAME }}/${{ env.COMMIT_SHORT_SHA }}/allure/index.html"
          DETEKT_REPORT_URL: "${{ env.PREVIEW_BASE_URL }}/${{ env.PROJECT_NAME }}/${{ env.COMMIT_SHORT_SHA }}/detekt/detekt.html"
          DOCS_PREVIEW_URL: "${{ env.PREVIEW_BASE_URL }}/${{ env.PROJECT_NAME }}/${{ env.COMMIT_SHORT_SHA }}/docs/index.html"
          DOKKA_URL: "${{ env.PREVIEW_BASE_URL }}/${{ env.PROJECT_NAME }}/${{ env.COMMIT_SHORT_SHA }}/docs/dokka/index.html"
          # Game test ワークフロー（fukurou）が同じ <sha>/ の下に置くビューア。テスト完了までは 404 になる
          GAME_TEST_URL: "${{ env.PREVIEW_BASE_URL }}/${{ env.PROJECT_NAME }}/${{ env.COMMIT_SHORT_SHA }}/game-test/index.html"
          LIMIT_TIME: ${{ env.LIMIT_TIME }}
        run: |
          cat << EOF > comment.md
          <!-- kerria:preview -->
          ## 🚀 Preview of ${{ github.event.repository.name }}

          ### 📦 Preview JARs
          Available for 7 days (until $LIMIT_TIME)
          | Artifact | Download | Size |
          |----------|----------|------|
          | Paper | [${{ env.PROJECT_NAME }}-paper-${{ env.COMMIT_SHORT_SHA }}.jar]($JAR_BASE_URL/${{ env.PROJECT_NAME }}-paper-${{ env.COMMIT_SHORT_SHA }}.jar) | ${{ steps.jar-sizes.outputs.paper }} |
          | API | [${{ env.PROJECT_NAME }}-api-${{ env.COMMIT_SHORT_SHA }}.jar]($JAR_BASE_URL/${{ env.PROJECT_NAME }}-api-${{ env.COMMIT_SHORT_SHA }}.jar) | ${{ steps.jar-sizes.outputs.api }} |

          > 📜 **Attestation**: \`gh attestation verify <jar-file> --owner morinoparty\`

          ### 📖 Documentation & Reports
          Available for 7 days (until $LIMIT_TIME)
          | 📖 Documentation | 📖 Dokka API | 🧪 Allure Report | 🧪 JUnit Report | 🔍 Detekt Report | 🦉 In-game Tests |
          |:---:|:---:|:---:|:---:|:---:|:---:|
          | [Preview]($DOCS_PREVIEW_URL) | [Preview]($DOKKA_URL) | [Report]($ALLURE_REPORT_URL) | [Report]($JUNIT_REPORT_URL) | [Report]($DETEKT_REPORT_URL) | [Viewer]($GAME_TEST_URL) |

          > 🦉 The in-game test viewer is available after the Game test workflow finishes.

          ### 🧪 Test Summary
          | Tests | Passed | Skipped | Failed |
          |-------|--------|---------|--------|
          | ${{ needs.build-gradle.outputs.test_total }} | ${{ needs.build-gradle.outputs.test_passed }} ✅ | ${{ needs.build-gradle.outputs.test_skipped }} ⏭️ | ${{ needs.build-gradle.outputs.test_failed }} ❌ |
          EOF

      # 同じ PR では新しいコメントを増やさず、既存のプレビューコメント（マーカー、または旧形式の見出しで判定）を更新する
      - name: Create or update PR comment
        run: |
          marker="<!-- kerria:preview -->"
          comment_id=$(gh api --paginate "repos/${{ github.repository }}/issues/${{ github.event.number }}/comments" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and ((.body | contains(\"$marker\")) or (.body | contains(\"## 🚀 Preview of\"))))] | last | .id // empty" | tail -n 1)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" -F body=@comment.md > /dev/null
          else
            gh pr comment ${{ github.event.number }} --body-file comment.md
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
