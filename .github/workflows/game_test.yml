name: Game test

on:
  pull_request:
  workflow_dispatch:
    inputs:
      minecraft-versions:
        description: 'Versions: "latest", "1.21.11", "1.21.11-" or "1.21.11-26.1"'
        default: "1.21.11-"
      tests:
        description: "Test ids (method names) or globs, comma separated. Empty runs everything"
        default: ""
      paper-channel:
        description: "Least stable Paper build channel to test: stable, beta or alpha"
        default: alpha

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# fukurou v3 はまだタグが無いため、すべてのアクションをコミット d87616a2521ec540af8e8a2d8f3358c48b340353 に固定する。
# gradle/libs.versions.toml の fukurou（d87616a252）と同じコミットにそろえること
jobs:
  # テストするバージョンの一覧を fukurou から受け取り、test ジョブの matrix にする
  versions:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - id: versions
        uses: morinoparty/fukurou/versions@d87616a2521ec540af8e8a2d8f3358c48b340353
        with:
          # Kerria がコンパイルしている paper-api（1.21.11）以降を確認する
          minecraft-version: ${{ inputs.minecraft-versions || '1.21.11-' }}
          # Paper がまだ alpha のバージョンも含めて確認する（test ジョブと同じ値にする）
          paper-channel: ${{ inputs.paper-channel || 'alpha' }}

  # テスト対象のプラグインを 1 回だけビルドし、各バージョンのジョブで使い回す
  build:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - id: sha
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8379f6a1328ee0e06e2bb424dadb7b159856a326 # v4.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # 名前を kerria.jar に固定して、test ジョブから -Pfukurou.plugin.kerria で渡しやすくする
      - name: Build the plugin jar
        run: |
          chmod +x ./gradlew
          ./gradlew :paper:shadowJar --no-daemon --console=plain
          mkdir -p plugin
          cp paper/build/libs/paper-*-all.jar plugin/kerria.jar

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugin
          path: plugin/kerria.jar
          if-no-files-found: error
          retention-days: 3

  # 1 バージョン = 1 ジョブ。拡張クラスごとのサーバーを Gradle の :paper:gameTest で実行する
  test:
    name: Minecraft ${{ matrix.minecraft-version }}
    needs: [versions, build]
    runs-on: ubuntu-24.04
    # Gradle ~3 分 + サーバー起動と 2 人の参加 ~6 分 + テスト 1 件 ~1 分
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        minecraft-version: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      # テストのソースと Gradle の設定を読むためにチェックアウトする
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: plugin
          path: ${{ runner.temp }}/plugins

      # fukurou のアクションの gradle-args は空白区切りで、引用符は使えない。
      # 入力は env 経由で受け取り、ここで組み立てる（シェルインジェクション対策）
      - id: args
        name: Build the Gradle arguments
        env:
          TESTS: ${{ inputs.tests }}
          PLUGIN_JAR: ${{ runner.temp }}/plugins/kerria.jar
        run: |
          args="-Pfukurou.plugin.kerria=$PLUGIN_JAR"
          if [ -n "$TESTS" ]; then
            IFS=',' read -ra ids <<< "$TESTS"
            # テスト id = メソッド名。引数を取るメソッドは "name(KerriaServer)" と報告されるため末尾も * にする
            for id in "${ids[@]}"; do
              id="$(echo "$id" | xargs)"
              args="$args --tests *.${id}*"
            done
            args="$args -Pfukurou.selection.tests=$(echo "$TESTS" | tr -d ' ')"
          fi
          echo "gradle-args=$args" >> "$GITHUB_OUTPUT"

      # Xvfb・xdotool・xmodmap・Mesa を入れ、Java 25 で ./gradlew :paper:gameTest を実行し、結果を artifact にする
      - id: fukurou
        uses: morinoparty/fukurou@d87616a2521ec540af8e8a2d8f3358c48b340353
        with:
          accept-eula: "true" # Minecraft EULA に同意する: https://aka.ms/MinecraftEULA
          minecraft-version: ${{ matrix.minecraft-version }}
          paper-channel: ${{ inputs.paper-channel || 'alpha' }}
          gradle-task: :paper:gameTest
          gradle-args: ${{ steps.args.outputs.gradle-args }}
          # Kerria の toolchain（gradle/libs.versions.toml の java）と同じ
          java-version: "25"

      # 失敗の詳細（スタックトレース）を見るための JUnit の XML。ui の artifact-pattern（fukurou-paper-*）には一致しない
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: junit-gametest-${{ matrix.minecraft-version }}
          path: paper/build/test-results/gameTest
          if-no-files-found: ignore
          retention-days: 7

  # 各バージョンの結果をまとめたビューアを作り、S3 に公開する
  deploy:
    needs: [build, test]
    # 一部のバージョンが失敗しても、失敗時のスクリーンショットを見られるようにする
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      # fork や Dependabot の PR には secret が渡らない。そのときは S3 へのアップロードを飛ばす
      BWS_ACCESS_TOKEN: ${{ secrets.NIKOMARU_BITWARDEN_SECRET_MANAGER_ACCESS_TOKEN }}
    outputs:
      # URL はバケット名などの secret を含みうるため、job output にすると GitHub に捨てられる。
      # アップロードできたかだけを渡し、URL は comment ジョブで組み立てる
      uploaded: ${{ steps.ui.outputs.uploaded }}
      # {"total","passed","failed","error","skipped"}: テスト × バージョンの件数
      tests-summary: ${{ steps.ui.outputs.tests-summary }}
      # "pay-with-message@1.21.11/kerria" のような一覧
      failed-tests: ${{ steps.ui.outputs.failed-tests }}
    steps:
      # preview.yml と同じく、Bitwarden Secrets Manager から S3 アップロード用の AWS 認証情報を取得する
      - name: Get S3 credentials from Bitwarden
        if: ${{ env.BWS_ACCESS_TOKEN != '' }}
        uses: bitwarden/sm-action@v2
        with:
          access_token: ${{ env.BWS_ACCESS_TOKEN }}
          secrets: |
            37e4d53a-a898-4e9f-b067-b49900deaf4f > AWS_ACCESS_KEY_ID
            4d92b739-40fc-467f-97fa-b49900deb52c > AWS_SECRET_ACCESS_KEY

      # aws-access-key-id が空なら（upload: auto）サイトは artifact としてだけ残る
      - id: ui
        uses: morinoparty/fukurou/ui@d87616a2521ec540af8e8a2d8f3358c48b340353
        with:
          title: Kerria ${{ needs.build.outputs.sha }}
          upload: auto
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          s3-endpoint: ${{ secrets.S3_ENDPOINT }}
          s3-bucket: ${{ secrets.S3_UPLOAD_BUCKET }}
          # preview.yml と同じ Kerria/<sha>/ の下に置く
          s3-prefix: Kerria/${{ needs.build.outputs.sha }}/game-test
          public-base-url: ${{ vars.PREVIEW_BASE_URL }}

  # テストの件数とビューアへのリンクを PR にコメントする（同じ PR では 1 件のコメントを更新する）
  comment:
    needs: [build, test, deploy]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.deploy.outputs.uploaded == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Post the game test result
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ needs.build.outputs.sha }}
          FUKUROU_URL: ${{ vars.PREVIEW_BASE_URL }}/Kerria/${{ needs.build.outputs.sha }}/game-test/index.html
          RESULT: ${{ needs.test.result }}
          TESTS_SUMMARY: ${{ needs.deploy.outputs.tests-summary }}
          FAILED_TESTS: ${{ needs.deploy.outputs.failed-tests }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          repo, pr = os.environ["GITHUB_REPOSITORY"], os.environ["PR"]
          marker = "<!-- fukurou:game-test -->"

          def gh(*args):
              return subprocess.run(["gh", *args], check=True, capture_output=True, text=True).stdout

          # 本文: 全体の結果、テスト × バージョンの件数、失敗したテスト、ビューアへのリンク
          icon = {"success": "✅", "failure": "❌"}.get(os.environ["RESULT"], "⚠️")
          counts = json.loads(os.environ.get("TESTS_SUMMARY") or "{}")
          detail = ", ".join(f"{counts[k]} {k}" for k in ("passed", "failed", "error", "skipped") if counts.get(k))
          body = f"{marker}\n### 🦉 In-game tests ({os.environ['SHA']})\n{icon} **{os.environ['RESULT']}**"
          if detail:
              body += f" ({detail} of {counts.get('total', 0)} test runs)"
          body += f" — [Open the viewer]({os.environ['FUKUROU_URL']})"
          failed = [t for t in os.environ.get("FAILED_TESTS", "").split(",") if t]
          if failed:
              body += "\n\nFailed: " + ", ".join(f"`{t}`" for t in failed[:20]) + (" …" if len(failed) > 20 else "")

          comments = json.loads(gh("api", "--paginate", "--slurp", f"repos/{repo}/issues/{pr}/comments"))
          mine = [c for page in comments for c in page if marker in c["body"]]
          if mine:
              gh("api", "-X", "PATCH", f"repos/{repo}/issues/comments/{mine[-1]['id']}", "-f", f"body={body}")
          else:
              gh("pr", "comment", pr, "--repo", repo, "--body", body)
          PY
