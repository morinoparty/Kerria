# Kerria の設定ファイル（HOCON 形式）
# 通貨（名前・記号・複数形・フォーマットなど）はデータベースで管理しています。
# 通貨の作成・編集は /kerria currency コマンドで行ってください。
# 値には環境変数を使えます（例: password = ${?KERRIA_DB_PASSWORD}）。

# デバッグモード
debug = false

# 既定の言語ロケール（例: ja, en）
# プレイヤーのクライアントロケールに対応する翻訳が無い場合や、コンソール宛のメッセージで使用する
default-locale = "ja"

economy {
  # 新規プレイヤーの初期残高（デフォルト通貨）
  initial-balance = 0.0
  # デフォルト通貨のID（/kerria currency default <name> で変更できる）
  default-currency-id = 1
}

database {
  # データベースの種類（sqlite | postgresql）
  mode = "sqlite"
  host = "localhost"
  port = 5432
  database = "kerria"
  username = "user"
  password = "password"

  # HikariCP の接続プール設定（PostgreSQL 使用時に有効）
  pool {
    # 最大コネクション数
    maximum-pool-size = 10
    # 最小アイドルコネクション数
    minimum-idle = 2
    # 接続タイムアウト（ミリ秒）
    connection-timeout = 30000
    # アイドルタイムアウト（ミリ秒）
    idle-timeout = 600000
    # コネクションの最大生存時間（ミリ秒）
    max-lifetime = 1800000
  }
}
