# Kerria メッセージ（日本語 / ja_JP）
# MiniMessage 形式で記述します。<name> 形式のプレースホルダはコマンド側から差し込まれます。

# --- 共通 ---
common.player-only=<red>このコマンドはプレイヤーのみが使用できます。
common.account-not-found=<red>アカウントが見つかりません。
common.target-account-not-found=<red>対象のアカウントが見つかりません。
common.currency-not-found=<red>通貨が見つかりません。
common.player-not-found=<red>プレイヤー <yellow><player></yellow> が見つかりません。
common.invalid-amount=<red>金額は正の数を指定してください。
common.invalid-message=<red>メッセージは <max> 文字以内で指定してください。
common.invalid-selector=<red>セレクタが不正です: <error>
common.no-targets=<red><yellow><player></yellow> に該当するプレイヤーがいません。

# --- 再読み込み (reload) ---
reload.success=<green>設定とメッセージを再読み込みしました。
reload.failed=<red>再読み込みに失敗しました: <error>

# --- 残高確認 (balance) ---
balance.result=<green>あなたの残高は<amount>です。
balance.fetch-failed=<red>残高の取得に失敗しました。

# --- 送金 (pay) ---
pay.self=<red>自分自身に送金することはできません。
pay.sender-account-not-found=<red>あなたのアカウントが見つかりません。
pay.target-account-not-found=<red>相手のアカウントが見つかりません。
pay.failed=<red>送金に失敗しました: <error>
pay.success=<green><yellow><player></yellow> に <amount> を送金しました。
pay.received=<green><yellow><player></yellow> から <amount> を受け取りました。

# --- 取引メッセージ (--message) ---
transaction.message=<gray>メッセージ: <reset><message>

# --- 管理者残高操作 (set/give/take) ---
admin.set.failed=<red><yellow><player></yellow> の残高の設定に失敗しました: <error>
admin.set.success-multiple=<green><count>/<total> 人の残高を <amount> に設定しました。
admin.set.success=<green><yellow><player></yellow> の残高を <amount> に設定しました。
admin.give.failed=<red><yellow><player></yellow> への入金に失敗しました: <error>
admin.give.success-multiple=<green><count>/<total> 人に <amount> を付与しました。
admin.give.received=<green>運営から <amount> を受け取りました。
admin.give.success=<green><yellow><player></yellow> に <given> を付与しました。残高: <balance>
admin.take.failed=<red><yellow><player></yellow> からの出金に失敗しました: <error>
admin.take.success-multiple=<green><count>/<total> 人から <amount> を徴収しました。
admin.take.success=<green><yellow><player></yellow> から <taken> を徴収しました。残高: <balance>

