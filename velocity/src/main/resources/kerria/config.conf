# Kerria（Velocity）の設定ファイル（HOCON 形式）
# Paper 側と同じデータベース（PostgreSQL 推奨）を指定すると、サーバーをまたいだ残高の参照・送金ができます。
# 値には環境変数を使えます（例: password = ${?KERRIA_DB_PASSWORD}）。

# 既定の通貨ID（Paper 側の economy.default-currency-id と同じ値にする）
default-currency-id = 1

database {
  # データベースの種類（sqlite | postgresql）
  mode = "postgresql"
  host = "localhost"
  port = 5432
  database = "kerria"
  username = "user"
  password = "password"

  # HikariCP の接続プール設定
  pool {
    # 最大コネクション数
    maximum-pool-size = 10
    # 最小アイドルコネクション数
    minimum-idle = 2
    # 接続タイムアウト（ミリ秒）
    connection-timeout = 30000
    # アイドルタイムアウト（ミリ秒）
    idle-timeout = 600000
    # コネクションの最大生存時間（ミリ秒）
    max-lifetime = 1800000
  }
}
